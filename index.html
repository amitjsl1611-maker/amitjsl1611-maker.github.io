<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product Design Leader combining business strategy, systems thinking, and human-centred design to help companies build better products.">
  <title>AJ — Product Design Leader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:          #F2F2F2;
      --text:        #0D0D0D;
      --text-muted:  #6A6A6A;
      --orange:      #FF5533;
      --orange-dark: #E03D1E;
      --white:       #FFFFFF;
      --border:      rgba(13,13,13,0.1);

      --font-display: 'Rethink Sans', sans-serif;
      --font-body:    'Rethink Sans', sans-serif;

      --nav-h:     72px;
      --max-w:     1200px;
      --gap:       16px;
      --section-v: 128px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── NAV ─────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 56px;
      z-index: 200;
    }

    .menu-btn {
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      z-index: 300;
    }

    .menu-btn span {
      display: block;
      width: 26px;
      height: 1.5px;
      background: var(--text);
      transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.3s ease,
                  background 0.3s ease;
      transform-origin: center;
    }

    .menu-btn.open span { background: #fff; }
    .menu-btn.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .menu-btn.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    /* ─── MENU OVERLAY ────────────────────────────── */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: #0D0D0D;
      z-index: 250;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 80px 60px;
      opacity: 0;
      pointer-events: none;
      clip-path: inset(0 0 100% 0);
      transition: opacity 0.2s ease-out,
                  clip-path 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: all;
      clip-path: inset(0 0 0% 0);
      transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                  clip-path 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .menu-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-links a {
      font-family: var(--font-display);
      font-size: clamp(44px, 6.5vw, 92px);
      font-weight: 700;
      line-height: 1.12;
      color: rgba(255,255,255,0.12);
      text-decoration: none;
      display: block;
      letter-spacing: -0.03em;
      transition: color 0.2s ease-out;
    }

    .menu-links a:hover { color: #fff; }

    .menu-footer {
      position: absolute;
      bottom: 56px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 32px;
    }

    .menu-contact-label {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 10px;
    }

    .menu-contact-link {
      font-family: var(--font-body);
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.25s;
    }

    .menu-contact-link:hover { color: var(--orange); }

    /* ─── HERO ────────────────────────────────────── */
    .hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: calc(var(--nav-h) + 24px) 56px 0;
      overflow: hidden;
    }

    .hero-inner {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      width: 100%;
      padding-bottom: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Page-load hero entry */
    @keyframes heroUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-headline {
      animation: heroUp 0.85s cubic-bezier(0.23, 1, 0.32, 1) 0.1s both;
    }

    .hero-sub {
      animation: heroUp 0.85s cubic-bezier(0.23, 1, 0.32, 1) 0.22s both;
    }

    .hero-ctas {
      animation: heroUp 0.85s cubic-bezier(0.23, 1, 0.32, 1) 0.32s both;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-headline,
      .hero-sub,
      .hero-ctas { animation: none; }
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(48px, 7.5vw, 112px);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 28px;
      text-align: center;
    }

    h1 .line { display: block; }

    /* Animated word carousel */
    .word-carousel {
      display: inline-block;
      position: relative;
      vertical-align: top;
      overflow: hidden;
      min-width: 5em;
      height: 1.04em;
    }

    .word-track span {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      color: var(--orange);
      transform: translateY(80%);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.35s ease-out;
    }

    .word-track span.active  { transform: translateY(0);    opacity: 1; }
    .word-track span.leaving { transform: translateY(-80%); opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .word-track span { transition: none; }
    }

    .hero-sub {
      font-family: var(--font-body);
      font-size: clamp(15px, 1.5vw, 18px);
      font-weight: 400;
      line-height: 1.75;
      color: var(--text-muted);
      max-width: 820px;
      margin: 0 0 44px;
      text-align: center;
    }

    .hero-ctas {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #fff;
      background: #0D0D0D;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s ease-out, transform 0.15s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .btn-primary:hover  { background: #2a2a2a; transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.97); transition: transform 0.1s ease-out; }

    .btn-secondary {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      background: transparent;
      border: 1.5px solid rgba(13,13,13,0.2);
      padding: 13px 28px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: border-color 0.2s ease-out, transform 0.15s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .btn-secondary:hover  { border-color: rgba(13,13,13,0.5); }
    .btn-secondary:active { transform: scale(0.97); transition: transform 0.1s ease-out; }

    .material-symbols-outlined {
      font-size: 18px;
      line-height: 1;
      vertical-align: middle;
    }

    /* ─── MARQUEE ─────────────────────────────────── */
    .marquee-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      padding: 18px 0;
      background: transparent;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 32s linear infinite;
      will-change: transform;
    }

    .marquee-track:hover { animation-play-state: paused; }

    .marquee-group {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .marquee-item {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding: 0 40px;
    }

    .marquee-item img {
      height: 26px;
      width: auto;
      max-width: 120px;
      object-fit: contain;
      display: block;
      transition: opacity 0.25s;
      opacity: 0.8;
    }

    .marquee-item:hover img { opacity: 1; }

    .marquee-sep {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      opacity: 0.22;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ─── SELECTED WORKS ──────────────────────────── */
    .works {
      padding: var(--section-v) 56px;
      max-width: calc(var(--max-w) + 112px);
      margin: 0 auto;
    }

    .section-header { margin-bottom: 56px; }

    .section-eyebrow {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 16px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 3.8vw, 52px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 16px;
    }

    .section-desc {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.75;
      max-width: 460px;
    }

    /* ─── HOW I WORK ─────────────────────────────── */
    /* Outer zone: creates the scroll travel distance */
    .approach-scroll-zone {
      position: relative;
      height: 250vh;
    }

    /* Section sticks to viewport for entire scroll zone */
    .approach {
      position: sticky;
      top: 0;
      height: 100vh;
      max-width: calc(var(--max-w) + 112px);
      margin: 0 auto;
      padding: 0 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Wave layout ── */
    .approach-wave-wrap {
      position: relative;
      height: 420px;
      margin-top: 40px;
      overflow: visible;
    }

    /* Ghost numbers hidden until node reveals */
    /* Shared ghost styles */
    .approach-ghost {
      font-family: var(--font-display);
      font-size: 200px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
      pointer-events: none;
      user-select: none;
    }

    /* Node groups — start hidden, pop in when path reaches them */
    .node-group {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Shimmer */
    .shimmer {
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .approach-wave-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }


    .approach-step {
      position: absolute;
      width: 240px;
      z-index: 2;
    }

    /* Ghost number lives inside each step, positioned behind text */
    .approach-step .approach-ghost {
      position: absolute;
      top: -50px;
      left: -24px;
      z-index: 0;
      background: linear-gradient(160deg, rgba(13,13,13,0.08) 0%, rgba(13,13,13,0.025) 55%, rgba(13,13,13,0) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .approach-step h3,
    .approach-step p { position: relative; z-index: 1; }

    /* Clear zones — well away from the path */
    .step-1 { top: 4%;  left: 0; }
    .step-2 { top: 62%; left: 44%; }
    .step-3 { top: 4%;  right: 0; }

    .approach-step h3 {
      font-family: var(--font-display);
      font-size: clamp(17px, 1.5vw, 20px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 10px;
    }

    .approach-step p {
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-muted);
    }

    @media (max-width: 1024px) {
      .approach { padding-left: 36px; padding-right: 36px; }
      .approach-wave-wrap { height: 360px; }
      .approach-ghost { font-size: 150px; }
      .approach-step { width: 190px; }
      .step-2 { left: 30%; }
    }

    @media (max-width: 768px) {
      .approach { padding-left: 24px; padding-right: 24px; }
      .approach-wave-wrap { height: auto; overflow: visible; }
      .approach-wave-svg  { display: none; }
      .approach-ghost     { display: none; }
      .approach-step {
        position: relative;
        top: auto; left: auto; right: auto;
        width: 100%;
        padding: 24px 0;
        border-top: 1px solid var(--border);
      }
      .approach-step:last-child { border-bottom: 1px solid var(--border); }
    }

    /* ─── BENTO GRID ──────────────────────────────── */
    .bento {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--gap);
    }

    /* Span classes */
    .c-xl   { grid-column: span 7; }
    .c-lg   { grid-column: span 5; }
    .c-md   { grid-column: span 4; }
    .c-half { grid-column: span 6; }
    .c-2t   { grid-column: span 8; }
    .c-fw   { grid-column: span 12; }

    /* ── Base card ── */
    .card {
      background: var(--white);
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 500px;
      opacity: 0;
      transform: translateY(28px);
    }

    .card.revealed {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.65s ease-out,
                  transform 0.65s cubic-bezier(0.23, 1, 0.32, 1),
                  box-shadow 0.4s ease;
    }

    .card.revealed:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.11);
    }

    .card.revealed:active {
      transform: scale(0.98);
      transition: transform 0.1s ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { opacity: 1; transform: none; }
      .card.revealed { transition: box-shadow 0.3s ease; }
    }

    /* ── Inset style (image top, white body below) ── */
    .card-img {
      flex: 0 0 58%;
      position: relative;
      overflow: hidden;
      background: var(--white);
    }

    /* Full-bleed cards: image edge-to-edge */
    .card.full .card-img img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.65s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* Inset cards: image padded with rounded corners */
    .card:not(.full) .card-img img {
      position: absolute;
      top: 12px;
      left: 12px;
      width: calc(100% - 24px);
      height: calc(100% - 24px);
      object-fit: cover;
      display: block;
      border-radius: 10px;
      transition: transform 0.65s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* Row card (NetBrahma): pad top/left/bottom, flush on right */
    .c-fw:not(.full) .card-img img {
      top: 12px;
      left: 12px;
      width: calc(100% - 12px);
      height: calc(100% - 24px);
      border-radius: 10px 0 0 10px;
    }

    .card.revealed:hover .card-img img { transform: scale(1.04); }

    .card-body {
      flex: 1;
      background: var(--white);
      padding: 22px 26px 26px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /* ── Full-bleed style (image covers card, text overlaid) ── */
    .card.full .card-img {
      position: absolute;
      inset: 0;
      flex: none;
      height: 100%;
    }

    .card.full .card-body {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top,
        rgba(0,0,0,0.85) 0%,
        rgba(0,0,0,0.55) 45%,
        transparent 100%);
      padding: 28px 28px 32px;
      gap: 10px;
    }

    .card.full .tag {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
    }

    .card.full .card-title { color: #fff; }
    .card.full .card-desc  { color: rgba(255,255,255,0.68); }
    .card.full .card-cta   { color: rgba(255,255,255,0.9); }

    /* ── Full-width row card (NetBrahma) ── */
    .c-fw {
      flex-direction: row;
    }

    .c-fw .card-img {
      flex: 0 0 45%;
      height: auto;
      min-height: 100%;
    }

    .c-fw .card-body {
      justify-content: center;
      padding: 40px 48px;
    }

    /* ── Tags, title, desc, cta ── */
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }

    .tag {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(13,13,13,0.07);
      padding: 4px 10px;
      border-radius: 100px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: clamp(17px, 1.6vw, 22px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .c-xl .card-title,
    .c-lg .card-title { font-size: clamp(20px, 1.9vw, 28px); }

    .c-fw .card-title { font-size: clamp(22px, 2.2vw, 32px); }

    .card-desc {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 420px;
    }

    .card-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--orange);
      margin-top: auto;
      transition: gap 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .card.revealed:hover .card-cta { gap: 12px; }

    /* ─── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 1024px) {
      :root { --section-v: 96px; }
      nav   { padding: 0 36px; }
      .hero { padding-left: 36px; padding-right: 36px; }
      .works { padding-left: 36px; padding-right: 36px; }
      .c-xl, .c-lg { grid-column: span 12; }
      .c-md { grid-column: span 6; }
      .c-half { grid-column: span 6; }
      .c-fw { flex-direction: column; height: auto; }
      .c-fw .card-img { flex: 0 0 280px; }
      .c-fw .card-body { padding: 28px 32px 36px; }
      .menu-overlay { padding: 80px 48px 60px; }
      .menu-footer { left: 48px; right: 48px; }
    }

    @media (max-width: 768px) {
      :root { --section-v: 80px; --gap: 12px; }
      nav   { padding: 0 24px; }
      .hero { padding: calc(var(--nav-h) + 20px) 24px 0; }
      .works { padding-left: 24px; padding-right: 24px; }
      .c-xl, .c-lg, .c-md, .c-half, .c-fw { grid-column: span 12; }
      .card { height: 440px; }
      .c-fw { flex-direction: column; height: auto; }
      .c-fw .card-img { flex: 0 0 240px; }
      .c-fw .card-body { padding: 24px 24px 32px; }
      .hero-inner { padding-bottom: 80px; }
      .menu-overlay { padding: 100px 28px 80px; }
      .menu-footer { left: 28px; right: 28px; flex-direction: column; gap: 20px; align-items: flex-start; }
      .menu-links a { font-size: clamp(36px, 11vw, 52px); }
    }

    @media (max-width: 480px) {
      nav   { padding: 0 20px; }
      .hero { padding-left: 20px; padding-right: 20px; }
      .works { padding-left: 20px; padding-right: 20px; }
    }

    /* ─── BEYOND THE WORK ───────────────────────────── */
    .beyond {
      padding: 160px 56px;
      max-width: calc(var(--max-w) + 112px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 80px;
      align-items: start;
    }

    .beyond-portrait-wrap {
      position: sticky;
      top: 100px;
    }

    .beyond-portrait {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 4px;
      filter: grayscale(100%) contrast(1.05);
      opacity: 0.88;
      display: block;
    }

    .beyond-portrait-placeholder {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 4px;
      background: linear-gradient(160deg, #d8d8d8 0%, #c4c4c4 100%);
      display: flex;
      align-items: flex-end;
      padding: 28px;
      box-sizing: border-box;
    }

    .beyond-portrait-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(13,13,13,0.35);
    }

    .beyond-content {
      padding-top: 8px;
    }

    .beyond-heading {
      font-family: var(--font-display);
      font-size: clamp(40px, 4.8vw, 68px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: #0D0D0D;
      margin-bottom: 48px;
    }

    .beyond-body p {
      font-family: var(--font-body);
      font-size: clamp(17px, 1.5vw, 20px);
      line-height: 1.72;
      color: rgba(13,13,13,0.58);
      margin-bottom: 28px;
      max-width: 58ch;
    }

    .beyond-body p:last-child { margin-bottom: 0; }

    /* ─── CONTACT ────────────────────────────────────── */
    .contact {
      padding: 160px 56px 120px;
      max-width: calc(var(--max-w) + 112px);
      margin: 0 auto;
      text-align: center;
      border-top: 1px solid rgba(13,13,13,0.08);
    }

    .contact-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 32px;
    }

    .contact-heading {
      font-family: var(--font-display);
      font-size: clamp(36px, 4.5vw, 62px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: #0D0D0D;
      margin-bottom: 28px;
      max-width: 18ch;
      margin-left: auto;
      margin-right: auto;
    }

    .contact-sub {
      font-size: clamp(16px, 1.4vw, 18px);
      line-height: 1.7;
      color: rgba(13,13,13,0.52);
      max-width: 48ch;
      margin: 0 auto 56px;
    }

    .contact-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0D0D0D;
      color: #fff;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 18px 40px;
      border-radius: 100px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.15s ease;
      margin-bottom: 56px;
    }

    .contact-cta:hover {
      background: var(--orange);
      transform: translateY(-2px);
    }

    .contact-cta:active { transform: translateY(0); }

    .contact-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    .contact-link {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(13,13,13,0.45);
      text-decoration: none;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .contact-link:hover { color: #0D0D0D; }

    .contact-link svg {
      width: 14px;
      height: 14px;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }

    .contact-link:hover svg { opacity: 1; }

    /* ─── FOOTER ─────────────────────────────────────── */
    .site-footer {
      border-top: 1px solid rgba(13,13,13,0.08);
      padding: 32px 56px;
      max-width: calc(var(--max-w) + 112px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-copy {
      font-size: 12px;
      color: rgba(13,13,13,0.35);
      letter-spacing: 0.02em;
    }

    .footer-note {
      font-size: 12px;
      color: rgba(13,13,13,0.28);
      letter-spacing: 0.02em;
    }

    /* ─── REVEAL ANIMATION ───────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.65s cubic-bezier(0.23,1,0.32,1), transform 0.65s cubic-bezier(0.23,1,0.32,1);
    }

    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* ─── RESPONSIVE: BEYOND + CONTACT + FOOTER ─────── */
    @media (max-width: 768px) {
      .beyond {
        grid-template-columns: 1fr;
        gap: 48px;
        padding: 100px 24px;
      }
      .beyond-portrait-wrap { position: static; }
      .beyond-portrait, .beyond-portrait-placeholder { aspect-ratio: 4/3; }
      .contact { padding: 100px 24px 80px; }
      .site-footer { padding: 28px 24px; flex-direction: column; gap: 12px; text-align: center; }
    }
</head>

  <script>
    // ── Menu ──────────────────────────────────────────────────────────
    const btn     = document.getElementById('menuBtn');
    const overlay = document.getElementById('menuOverlay');
    let isOpen = false;

    function toggleMenu(open) {
      isOpen = open;
      btn.classList.toggle('open', isOpen);
      overlay.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    btn.addEventListener('click', () => toggleMenu(!isOpen));
    overlay.querySelectorAll('a').forEach(a => a.addEventListener('click', () => toggleMenu(false)));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) toggleMenu(false); });

    // ── Word carousel ─────────────────────────────────────────────────
    const track = document.getElementById('wordTrack');
    const items = Array.from(track.children);
    let current = 0;

    function initCarousel() {
      items[0].classList.add('active');
      setInterval(advance, 2200);
    }

    function advance() {
      const prev = items[current];
      current = (current + 1) % items.length;
      const next = items[current];

      prev.classList.remove('active');
      prev.classList.add('leaving');
      next.classList.add('active');

      setTimeout(() => {
        prev.style.transition = 'none';
        prev.classList.remove('leaving');
        prev.offsetHeight;
        prev.style.transition = '';
      }, 620);
    }

    initCarousel();

    // ── Card scroll reveal ────────────────────────────────────────────
    const cards = document.querySelectorAll('.card');

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            // Stagger based on card's index within its row
            const card = entry.target;
            const siblings = Array.from(card.parentElement.children);
            const index = siblings.indexOf(card);
            const delay = (index % 4) * 80;
            setTimeout(() => card.classList.add('revealed'), delay);
            observer.unobserve(card);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

      cards.forEach(card => observer.observe(card));
    } else {
      // Fallback for old browsers
      cards.forEach(card => card.classList.add('revealed'));
    }
    // ── Approach scroll-driven path reveal ────────────────────────────
    (function initApproachAnim() {
      const scrollZone = document.querySelector('.approach-scroll-zone');
      if (!scrollZone) return;

      const svg        = document.querySelector('.approach-wave-svg');
      const mainCurve  = svg.querySelector('.main-curve');
      const shadowCurve= svg.querySelector('.shadow-curve');
      const shimmer    = svg.querySelector('.shimmer');
      const nodeGroups = svg.querySelectorAll('.node-group');
      const steps      = document.querySelectorAll('.approach-step');

      const totalLength = mainCurve.getTotalLength();

      // Binary search: find arc length at which path crosses a given x
      function getLengthAtX(targetX) {
        let lo = 0, hi = totalLength;
        for (let i = 0; i < 64; i++) {
          const mid = (lo + hi) / 2;
          mainCurve.getPointAtLength(mid).x < targetX ? (lo = mid) : (hi = mid);
        }
        return (lo + hi) / 2;
      }

      // Node positions in SVG viewBox x-coords
      const nodeLengths = [270, 600, 940].map(getLengthAtX);

      // Init — paths fully hidden
      [mainCurve, shadowCurve].forEach(p => {
        p.style.strokeDasharray  = totalLength;
        p.style.strokeDashoffset = totalLength;
      });
      shimmer.style.opacity = '0';

      let rafId = null;
      let lastProgress = -1;

      function update() {
        rafId = null;
        const rect       = scrollZone.getBoundingClientRect();
        const scrollable = scrollZone.offsetHeight - window.innerHeight;
        const progress   = Math.max(0, Math.min(1, -rect.top / scrollable));

        if (Math.abs(progress - lastProgress) < 0.0005) return;
        lastProgress = progress;

        const currentLen = progress * totalLength;
        const dashOffset = totalLength - currentLen;

        mainCurve.style.strokeDashoffset   = dashOffset;
        shadowCurve.style.strokeDashoffset = dashOffset;

        // Shimmer at leading edge
        if (currentLen > 10 && currentLen < totalLength - 10) {
          const pt = mainCurve.getPointAtLength(currentLen);
          shimmer.setAttribute('transform', `translate(${pt.x},${pt.y})`);
          shimmer.style.opacity = '1';
        } else {
          shimmer.style.opacity = '0';
        }

        // Reveal nodes + text when path reaches them
        nodeLengths.forEach((nodeLen, i) => {
          const reached = currentLen >= nodeLen;
          nodeGroups[i].style.opacity   = reached ? '1' : '0';
          nodeGroups[i].style.transform = reached ? 'scale(1)' : 'scale(0.5)';
          steps[i].style.opacity        = reached ? '1' : '0';
          steps[i].style.transform      = reached ? 'translateY(0)' : 'translateY(14px)';
        });
      }

      window.addEventListener('scroll', () => {
        if (!rafId) rafId = requestAnimationFrame(update);
      }, { passive: true });

      // Initial state — hide steps and run once
      steps.forEach(s => {
        s.style.opacity   = '0';
        s.style.transform = 'translateY(14px)';
        s.style.transition= 'opacity 0.5s ease, transform 0.5s ease';
      });
      update();
    })();

    // ── Scroll Reveal ─────────────────────────────────
    (function initReveal() {
      const els = document.querySelectorAll('.reveal');
      if (!els.length) return;
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e, i) => {
          if (!e.isIntersecting) return;
          // stagger siblings inside the same parent
          const siblings = [...e.target.parentElement.querySelectorAll('.reveal:not(.in-view)')];
          const idx = siblings.indexOf(e.target);
          setTimeout(() => e.target.classList.add('in-view'), idx * 80);
          io.unobserve(e.target);
        });
      }, { threshold: 0.12 });
      els.forEach(el => io.observe(el));
    })();

  </script>

</body>
</html>
